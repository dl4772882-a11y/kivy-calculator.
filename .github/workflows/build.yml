name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev cmake openjdk-17-jdk-headless python3-pip zip unzip lld

      - name: Setup Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython==0.29.33 sh

      - name: Accept Android Licenses & Build
        run: |
          export PATH=$PATH:~/.local/bin
          # 1. Скачиваем SDK, чтобы инструмент лицензий стал доступен
          buildozer android precaches || true
          # 2. Намертво принимаем абсолютно все лицензии Google через официальный SDK Manager
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # 3. Запускаем чистую сборку приложения
          buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
